# Extension Paperclip — fidélité runtime du package (adapters, heartbeats, budgets, routines).
# Le package markdown reste lisible sans ce fichier ; Paperclip l'applique à l'import.
# Les heartbeats sont importés désactivés par sécurité : activer le CEO en premier.
schema: paperclip/v1

agents:
  ceo:
    role: ceo
    icon: briefcase
    adapter:
      type: claude_local
      config:
        model: claude-opus-5-5
        effort: high
        maxTurnsPerRun: 80
    runtime:
      heartbeat:
        intervalSec: 3600
        cooldownSec: 60
        wakeOnAssignment: true
        wakeOnDemand: true
        wakeOnAutomation: true
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: true
      canCreateSkills: true
    budgetMonthlyCents: 15000
    inputs:
      env:
        CLAUDE_CODE_OAUTH_TOKEN:
          kind: secret
          requirement: optional
        ANTHROPIC_API_KEY:
          kind: secret
          requirement: optional
        GH_TOKEN:
          kind: secret
          requirement: optional
        ATTIO_API_KEY:
          kind: secret
          requirement: optional

