    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1"
        timezone: Europe/Paris
  rapport-clients-vendredi:
    triggers:
      - kind: schedule
        cronExpression: "0 17 * * 5"
        timezone: Europe/Paris
  veille-securite-dependances:
    triggers:
      - kind: schedule
        cronExpression: "30 7 * * 3"
        timezone: Europe/Paris
  veille-visios-attio:
    triggers:
      - kind: schedule
        cronExpression: "15 8-20/3 * * 1-6"
        timezone: Europe/Paris
