# Paperclip — orchestrateur d'agents IA (paperclip.ing) — déploiement Coolify
# ---------------------------------------------------------------------------
# Coolify > Projects > (Pixeeplay) > New Resource > "Docker Compose Empty"
# Collez ce fichier tel quel. Coolify remplit lui-même les variables SERVICE_*,
# assigne le domaine (paperclip.pixeeplay.com) au service `paperclip` et
# publie le port 3100 via Traefik avec un certificat Let's Encrypt.
#
# Variables à renseigner dans Coolify (onglet Environment Variables) :
#   CLAUDE_CODE_OAUTH_TOKEN   token d'abonnement Claude Max (claude setup-token)
#   ANTHROPIC_API_KEY         (optionnel) clé API si vous préférez la facturation API
#   GH_TOKEN                  (optionnel) PAT GitHub pour que les agents poussent/ouvrent des PR
#   OPENAI_API_KEY            (optionnel) pour l'adapter codex_local
#
# Image officielle multi-arch publiée à chaque release : ghcr.io/paperclipai/paperclip
# Épinglez une version (ex. :1.4.2) une fois en production stable.

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    # tini est PID 1 dans l'image ; ce plafond évite qu'une fuite de processus
    # d'un agent n'affame le VPS (les agents lancent git/claude/esbuild…).
    pids_limit: 2048
    environment:
      # --- Coolify : domaine + proxy vers le port 3100 -----------------------
      - SERVICE_URL_PAPERCLIP_3100
      # --- Serveur -----------------------------------------------------------
      - HOST=0.0.0.0
      - PORT=3100
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_INSTANCE_ID=pixeeplay
      - TZ=Europe/Paris
      - NODE_OPTIONS=--max-old-space-size=2048
      # --- Base de données ---------------------------------------------------
      - DATABASE_URL=postgres://paperclip:${SERVICE_PASSWORD_POSTGRES}@db:5432/paperclip
      # --- Mode de déploiement : login obligatoire, exposé sur Internet (TLS) --
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=public
      - PAPERCLIP_PUBLIC_URL=${SERVICE_URL_PAPERCLIP}
      - PAPERCLIP_AUTH_BASE_URL_MODE=explicit
      # Passez à "true" dès que votre compte admin est créé (verrouille l'inscription).
      - PAPERCLIP_AUTH_DISABLE_SIGN_UP=${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-false}
      # --- Secrets générés par Coolify (64 caractères) ------------------------
      - BETTER_AUTH_SECRET=${SERVICE_PASSWORD_64_BETTERAUTH}
      - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${SERVICE_PASSWORD_64_TOOLSIGNING}
      # --- Moteurs IA des agents (renseignés dans Coolify) --------------------
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GH_TOKEN=${GH_TOKEN:-}
      # --- Accès Coolify pour l'agent DevOps & Release (deploy/rotate-coolify-token.sh) ---
      - COOLIFY_URL=${COOLIFY_URL:-http://51.75.31.123:8000}
      - COOLIFY_API_TOKEN=${COOLIFY_API_TOKEN:-}
      - COOLIFY_SERVER_UUID=${COOLIFY_SERVER_UUID:-}
      - COOLIFY_PROJECT_UUID=${COOLIFY_PROJECT_UUID:-}
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-Pixeeplay Agents}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-agents@pixeeplay.com}
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME:-Pixeeplay Agents}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL:-agents@pixeeplay.com}
      # --- Divers ------------------------------------------------------------
      - PAPERCLIP_TELEMETRY_DISABLED=1
      - PAPERCLIP_DB_BACKUP_ENABLED=true
      - PAPERCLIP_DB_BACKUP_RETENTION_DAYS=14
    volumes:
      # Données Paperclip : workspaces des agents, uploads, clé de chiffrement
      # des secrets, sauvegardes, config Claude Code (~/.claude sous /paperclip).
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3100/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=paperclip
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=paperclip
      - TZ=Europe/Paris
    volumes:
      - paperclip-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  paperclip-data:
  paperclip-pgdata:
